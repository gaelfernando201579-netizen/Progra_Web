<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Grados - Ejercicio 10</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-calculadora">
        <h1>Conversor de Temperatura</h1>
        <p class="subtitulo">De grados Celsius a Fahrenheit</p>
        
        <!-- Campo de entrada para Celsius -->
        <div class="grupo-formulario">
            <label for="celsius">Grados Celsius (°C)</label>
            <input type="number" id="celsius" placeholder="Ej: 25" required>
            <span id="mensaje-error" class="error"></span>
        </div>

        <!-- Botón para iniciar la conversión -->
        <button type="button" class="boton-convertir" id="btn-convertir">
            Convertir
        </button>

        <!-- Caja de texto bloqueada para mostrar el resultado -->
        <div class="grupo-formulario resultado-grupo">
            <label for="fahrenheit">Grados Fahrenheit (°F)</label>
            <input type="text" id="fahrenheit" readonly placeholder="El resultado aparecerá aquí">
        </div>
    </div>

    <script src="js/ejercicio10.js"></script>
</body>
</html>
