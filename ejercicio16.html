<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Ejercicio 16</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/image.png">
</head>
<body>
    <div class="contenedor-calculadora">
        <h1>Calculadora Básica</h1>
        <p class="subtitulo">Operaciones básicas con funciones flecha</p>
        
        <div class="grupo-formulario">
            <label for="numero1">Ingresa el primer número:</label>
            <input type="text" id="numero1" placeholder="Ej: 10" required>
        </div>

        <div class="grupo-formulario">
            <label for="numero2">Ingresa el segundo número:</label>
            <input type="number" id="numero2" placeholder="Ej: 20" required>
        </div>

        <div class="contenedor-botones">
            <button type="button" class="boton-convertir" id="btn-sum">
                +
            </button>

            <button type="button" class="boton-convertir" id="btn-res">
                -
            </button>

            <button type="button" class="boton-convertir" id="btn-mul">
                *
            </button>

            <button type="button" class="boton-convertir" id="btn-div">
                /
            </button>
        </div>

        <div class="grupo-formulario resultado-grupo">
            <label for="resultado">Resultado de la operación:</label>
            <input type="text" id="resultado" readonly placeholder="El resultado aparecerá aquí">
        </div>
        <br>
        <a href="index.html" style="display: inline-block; padding: 8px 16px; background-color: #f1f5f9; color: #334155; text-decoration: none; border-radius: 6px; font-family: sans-serif; font-size: 14px; font-weight: bold; border: 1px solid #cbd5e1;">&#8592; Volver al inicio</a>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/ejercicio16.js"></script>
</body>
</html>
